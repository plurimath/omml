name: portable model declarations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUNDLE_GEMFILE: .ci/Gemfile.portable
  LUTAML_MODEL_SOURCE: .build/lutaml-model
  LUTAML_MODEL_COMMIT: eff859d0f6c2bb0936dd3add8ee252aea9dbaa17

jobs:
  enum-declarations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lutaml/lutaml-model
          ref: eff859d0f6c2bb0936dd3add8ee252aea9dbaa17
          path: .build/lutaml-model
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Require the declared candidate API
        run: bundle exec ruby -rlutaml/model/lml -e 'raise "missing candidate registry" unless Lutaml::Model::Lml::ValueDeclarations::VERSION == 1'
      - name: Replay native scalar and namespace behavior across adapters
        run: bundle exec rspec spec/omml/portable_spec.rb
      - name: Reproduce the owned declaration artifact
        run: |
          bundle exec ruby -Ilib scripts/export_portable_models.rb .build/portable
          cmp model/portable/enum-subset-v1.json .build/portable/enum-subset-v1.json
          cmp model/portable/scalar-subset-v1.json .build/portable/scalar-subset-v1.json
          cmp model/portable/runtime-graph-v1.json .build/portable/runtime-graph-v1.json
          bundle exec ruby -Ilib -romml -e 'raise "wrong model count" unless Omml::Portable.model_declarations.fetch("models").length == 1'
